[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
src_filter = -<solar.cpp> -<solar_ble.cpp> -<wifi_scanner.cpp>
lib_deps =
  https://github.com/bblanchon/ArduinoJson.git
  https://github.com/marcoschwartz/LiquidCrystal_I2C.git
  https://github.com/smarmengol/Modbus-Master-Slave-for-Arduino.git
  https://github.com/h2zero/NimBLE-Arduino.git
  https://github.com/Links2004/arduinoWebSockets.git
  https://github.com/adafruit/MAX6675-library.git
extra_scripts = pre:scripts/load_env.py

; Entorno para Solar (monitor CAYAPA) - compila solo solar.cpp
[env:solar]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
src_filter = +<solar.cpp> -<main.cpp> -<solar_ble.cpp>
lib_deps =
  https://github.com/bblanchon/ArduinoJson.git
  https://github.com/marcoschwartz/LiquidCrystal_I2C.git
extra_scripts = pre:scripts/load_env.py

; Escáner WiFi - detecta 2.4 vs 5 GHz (Maxwell/Curie)
[env:wifi_scanner]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
src_filter = +<wifi_scanner.cpp> -<main.cpp> -<solar.cpp> -<solar_ble.cpp>

; Solar + BLE (CAYAPA + envío adcValue por Bluetooth)
[env:solar_ble]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D CONFIG_BT_NIMBLE_TASK_STACK_SIZE=5120
src_filter = +<solar_ble.cpp> -<main.cpp> -<solar.cpp> -<wifi_scanner.cpp>
lib_deps =
  https://github.com/bblanchon/ArduinoJson.git
  https://github.com/marcoschwartz/LiquidCrystal_I2C.git
  https://github.com/h2zero/NimBLE-Arduino.git
extra_scripts = pre:scripts/load_env.py
