[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
src_filter = -<solar.cpp> -<wifi_scanner.cpp>
lib_deps =
  https://github.com/bblanchon/ArduinoJson.git
  https://github.com/marcoschwartz/LiquidCrystal_I2C.git
  https://github.com/smarmengol/Modbus-Master-Slave-for-Arduino.git
  https://github.com/h2zero/NimBLE-Arduino.git
  https://github.com/Links2004/arduinoWebSockets.git
  https://github.com/adafruit/MAX6675-library.git
build_flags =
  -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
  -D WIFI_PASS=\"${sysenv.WIFI_PASS}\"
extra_scripts = pre:scripts/load_env.py

; Entorno para Solar (monitor CAYAPA) - compila solo solar.cpp
[env:solar]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
src_filter = +<solar.cpp> -<main.cpp>
lib_deps =
  https://github.com/bblanchon/ArduinoJson.git
  https://github.com/marcoschwartz/LiquidCrystal_I2C.git
build_flags =
  -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
  -D WIFI_PASS=\"${sysenv.WIFI_PASS}\"
  -D SERVER_URL=\"${sysenv.SERVER_URL}\"
extra_scripts = pre:scripts/load_env.py

; Escáner WiFi - detecta 2.4 vs 5 GHz (Maxwell/Curie)
[env:wifi_scanner]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
src_filter = +<wifi_scanner.cpp> -<main.cpp> -<solar.cpp>
